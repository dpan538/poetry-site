[workspace]
members = ["crates/reader-core", "crates/site", "crates/ssg", "crates/browser", "crates/lab", "crates/originals", "crates/studies"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev]
debug = 0

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 2

[profile.dev.package."gemm-f32"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
