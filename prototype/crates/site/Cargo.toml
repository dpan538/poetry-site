[package]
name = "manifold-site"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
candle-core = "=0.9.2"
candle-nn = "=0.9.2"
candle-transformers = "=0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-render = "=0.15.1"
