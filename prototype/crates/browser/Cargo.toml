[package]
name = "daipan-browser"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
reader-core = { path = "../reader-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Animation", "CanvasRenderingContext2d", "CssStyleDeclaration", "Document", "DomRect",
  "DomTokenList", "Element", "Event", "EventTarget", "HtmlCanvasElement",
  "HtmlDialogElement", "HtmlElement", "KeyboardEvent", "Location", "MediaQueryList",
  "Node", "NodeList", "Text", "Storage", "Window", "HtmlAnchorElement", "HtmlButtonElement",
  "HtmlImageElement", "HtmlPreElement", "PointerEvent", "MouseEvent", "HtmlFormElement", "Performance",
  "ResizeObserver", "HtmlCollection", "CustomEvent", "CustomEventInit", "TextMetrics", "Range", "History", "PopStateEvent", "ScrollRestoration",
] }
